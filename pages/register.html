<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastro - Mundo Mágico</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="container" style="padding:40px 0">
    <h2>Cadastrar</h2>
    <form id="registerForm" style="max-width:480px;margin-top:18px">
      <input type="text" id="nome" placeholder="Seu nome" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="senha" placeholder="Senha" required />
      <div style="margin-top:12px">
        <button class="btn" type="submit">Criar conta</button>
        <a href="login.html" class="btn btn-outline" style="margin-left:8px">Entrar</a>
      </div>
    </form>
  </main>

  <script>
    const API_URL = "http://localhost:8099/api";
    document.getElementById('registerForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      try{
        const res = await fetch(`${API_URL}/auth/register`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({nome, email, senha, role: 'CLIENTE'})
        });
        if(!res.ok){ alert('Erro ao cadastrar'); return; }
        alert('Cadastro realizado com sucesso');
        location.href = 'login.html';
      }catch(err){ alert('Erro de conexão'); console.error(err) }
    });
  </script>
</body>
</html>
